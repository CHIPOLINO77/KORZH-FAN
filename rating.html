<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Рейтинг — KORZH FAN</title><link rel="stylesheet" href="style-v2.css"><link rel="stylesheet" href="photo-layer.css"><style>@media(max-width:800px){.photo-page.photo-rating .rating-grid{gap:8px}.photo-page.photo-rating .rating-item{min-height:0;padding:12px 13px;border-radius:14px;display:grid;grid-template-columns:30px 1fr auto;grid-template-rows:auto auto;column-gap:9px;row-gap:5px;align-items:center}.photo-page.photo-rating .rating-item .rank{width:26px;height:26px;display:grid;place-items:center;border:1px solid rgba(239,61,53,.35);border-radius:9px;background:rgba(239,61,53,.07);font:700 9px/1 monospace}.photo-page.photo-rating .rating-item .rating-name{font-size:17px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.photo-page.photo-rating .rating-item .rating-count{font-size:9px;line-height:1;color:#777;white-space:nowrap}.photo-page.photo-rating .rating-item .rating-bar{grid-column:2/-1;height:3px;margin:1px 0 0;border-radius:99px}.photo-page.photo-rating .rating-item .rating-bar i{height:100%;border-radius:99px;display:block}.photo-page.photo-rating .rating-item:hover{transform:none}.photo-page.photo-rating .btn{min-height:42px;border-radius:12px;margin-top:14px}}@media(max-width:480px){.photo-page.photo-rating .rating-item{grid-template-columns:28px 1fr auto;padding:10px 11px;border-radius:13px}.photo-page.photo-rating .rating-item .rank{width:24px;height:24px;border-radius:8px;font-size:8px}.photo-page.photo-rating .rating-item .rating-name{font-size:16px}.photo-page.photo-rating .rating-item .rating-count{font-size:8px}.photo-page.photo-rating .rating-bar{height:2px}.photo-page.photo-rating .section:not(.page-hero):before{margin-bottom:14px}}</style></head><body class="photo-page photo-rating"><div class="noise"></div><header class="topbar"><a class="brand" nt.body.classList.remove('menu-open');menu.setAttribute('aria-expanded','false')});</script></body></html>
