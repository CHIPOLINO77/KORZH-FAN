<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Рейтинг — KORZH FAN</title><link rel="stylesheet" href="style-v2.css"><link rel="stylesheet" href="photo-layer.css"></head><body class="photo-page photo-rating"><div class="noise"></div><header class="topbar"><a class="brand" href="index.html">KORZH<span>FAN</span></a><nav><a href="test.html">Тест</a><a class="active" href="rating.html">Рейтинг</a><a href="cities.html">Города</a><a href="stories.html">Истории</a><a href="photos.html">Фото</a><a href="concerts.html">Концерты</a><a href="support.html">Поддержка</a></nav><button class="menu-btn" id="menuBtn" aria-label="Открыть меню" aria-expanded="false">☰</button></header><main><section class="section page-hero"><p class="eyebrow">02 / РЕЙТИНГ</p><h1>КАКОЙ ТИП<br><em>ПОБЕЖДАЕТ?</em></h1><p class="lead">Рейтинг твоих результатов на этом устройстве.</p><p class="photo-credit">Фотофон: Прага 22.06.2024 · <a href="https://maxkorzh.live/foto/" target="_blank" rel="noopener">официальный фотоархив</a></p></section><section class="section rating"><div class="rating-grid" id="ratingGrid"></div><a class="btn btn-primary" href="test.html">ПРОЙТИ ТЕСТ →</a></section></main><footer class="footer"><a href="index.html">← На главную</a><span>KORZH FAN — независимый фан-проект</span></footer><script>const types={freedom:'СВОБОДНЫЙ',drive:'ПАЦАН С ПЛАНОМ',loyalty:'СВОЙСКИЙ',night:'НОЧНОЙ БЕГЛЕЦ',romance:'РОМАНТИК',party:'ДВИЖОВЫЙ',adventure:'ВЕЧНО В ПУТИ'};const order=Object.keys(types);const stats=JSON.parse(localStorage.getItem('korzhTypeStats')||'{}');const total=Object.values(stats).reduce((a,b)=>a+b,0);document.getElementById('ratingGrid').innerHTML=order.map((t,i)=>{const n=stats[t]||0;const p=total?Math.max(8,Math.round(n/total*100)):8;return `<article class="rating-item"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="rating-name">${types[t]}</span><span class="rating-count">${n} результатов</span><div class="rating-bar"><i style="--w:${p}%"></i></div></article>`}).join('');const menu=document.getElementById('menuBtn');menu.onclick=()=>{document.body.classList.toggle('menu-open');menu.setAttribute('aria-expanded',document.body.classList.contains('menu-open'))};document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{document.body.classList.remove('menu-open');menu.setAttribute('aria-expanded','false')});</script></body></html>
